name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }} Test & Quality Gate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify code style & formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript strict compilation
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Run Vitest test suite (339 tests)
        run: npm test

      - name: Execute Risk Engine Benchmark & Regression Gate
        run: npm run benchmark
