name: Build Desktop Tray Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: x86_64-apple-darwin
            artifact: defcon-tray
            
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            artifact: defcon-tray.exe
            
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            artifact: defcon-tray

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tray Binary
        run: |
          cd packages/desktop-tray/src-tauri
          cargo build --release --target ${{ matrix.target }}

      - name: Create binaries directory
        run: mkdir -p packages/desktop-tray/binaries/${{ matrix.platform }}

      - name: Copy binary
        run: |
          cp packages/desktop-tray/src-tauri/target/${{ matrix.target }}/release/${{ matrix.artifact }} \
             packages/desktop-tray/binaries/${{ matrix.platform }}/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tray-${{ matrix.platform }}
          path: packages/desktop-tray/binaries/${{ matrix.platform }}/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/tray-macos/defcon-tray
            artifacts/tray-windows/defcon-tray.exe
            artifacts/tray-linux/defcon-tray
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
